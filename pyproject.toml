[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlgidmatch"
version = "0.1.3"
description = "Performs peak-to-structure matching of GID patterns"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Mikhail Romodin" }]
dependencies = [
    "numpy>=1.24.4",
    "pymatgen>=2023.8.10",
    "pygidsim>=0.1.4,<0.2.0",
    "xrayutilities>=1.7.6",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.10.0",
]

[project.urls]
Homepage = "https://github.com/mlgid-project/mlgidMATCH"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["mlgidmatch*", "tests*"]

[tool.setuptools.package-data]
mlgidmatch = ["ResNet18_best_model.pt"]
